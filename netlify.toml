# Netlify Configuration for VaultPass
[build]
  command = "npm run build"
  publish = "dist"

# Single Page Application (SPA) routing redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers for Enterprise-Grade Password Manager
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), publickey-credentials-get=(self), publickey-credentials-create=(self)"
